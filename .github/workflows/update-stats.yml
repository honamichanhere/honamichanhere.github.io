name: Update video stats

on:
  schedule:
    - cron: "17 * * * *"       # tiap jam (menit ke-17 supaya tidak bentrok jam sibuk GitHub)
  workflow_dispatch:           # bisa dijalankan manual dari tab Actions
  push:
    paths: ["js/data.js", "scripts/update-stats.mjs"]

permissions:
  contents: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch stats from YouTube
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: node scripts/update-stats.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/stats.json
          git diff --staged --quiet || (git commit -m "chore: update video stats" && git fetch origin main && git rebase origin/main && git push origin HEAD:main)
